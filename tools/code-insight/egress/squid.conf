# Proxy chỉ cho phép ĐI RA tới API của nhà cung cấp LLM (cổng 443) — mọi đích khác bị chặn. Worker nằm trong mạng "internal" của Docker (không có đường ra),
# chỉ nói chuyện được với proxy này. Muốn thêm đích (vd proxy công ty) thì sửa ở đây và xem lại mô hình đe dọa.
http_port 3128
acl dich_api dstdomain api.anthropic.com
acl cong_tls port 443
acl phuong_thuc_ket_noi method CONNECT
http_access allow phuong_thuc_ket_noi cong_tls dich_api
http_access deny all
cache deny all
access_log stdio:/dev/stdout
